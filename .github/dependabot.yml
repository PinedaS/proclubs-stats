# Dependabot (gratis): propone actualizaciones semanales como pull requests.
# La CI corre sobre cada una antes de aceptarla.
version: 2
updates:
  - package-ecosystem: npm
    directory: /collector
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # El colector corre en Node 22 (collect.yml, ci.yml): los tipos deben ser de
    # Node 22, o permitirían usar funciones que Node 22 no tiene.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dependencias:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ['*']
