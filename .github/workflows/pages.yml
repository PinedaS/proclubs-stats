# Publica el dashboard (carpeta dashboard/, estática) en GitHub Pages. Gratis en repos públicos.
name: Dashboard

on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Dos trabajos, como en la plantilla oficial de GitHub (2026-11-22): con subir y
# desplegar en el mismo trabajo, deploy-pages falló 3 veces en un día con "No artifacts
# named github-pages were found": a veces busca el paquete antes de que GitHub lo
# registre. Separados, el despliegue empieza cuando la subida ya terminó.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Versionar archivos (evita mezclar versiones viejas desde la caché)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__V__/${V}/g" dashboard/index.html dashboard/app.js dashboard/api.js
          grep -c "$V" dashboard/index.html dashboard/app.js dashboard/api.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
