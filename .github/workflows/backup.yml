# Respaldo semanal CIFRADO de toda la base (gratis).
# Supabase Free no tiene respaldos y EA no deja recuperar partidos viejos.
# El repo es público: el respaldo se cifra con AES-256 usando el secreto
# BACKUP_PASSPHRASE antes de subirlo a la rama `backups`. Sin esa contraseña es ilegible.
name: Respaldo

on:
  schedule:
    - cron: '23 6 * * 0' # domingos 06:23 UTC
  workflow_dispatch:

concurrency:
  group: respaldo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: Instalar dependencias
        working-directory: collector
        run: npm ci

      - name: Exportar tablas (solo en el runner, sin publicar)
        working-directory: collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.ts "$RUNNER_TEMP/export"

      - name: Traer los respaldos anteriores
        run: |
          mkdir -p "$RUNNER_TEMP/branch"
          if git fetch --depth=1 origin backups; then
            git --work-tree="$RUNNER_TEMP/branch" checkout FETCH_HEAD -- .
          fi

      - name: Comprimir y cifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash collector/scripts/encrypt-backup.sh "$RUNNER_TEMP/export" "$RUNNER_TEMP/branch" 12

      - name: Borrar la exportación sin cifrar
        if: always()
        run: rm -rf "$RUNNER_TEMP/export"

      - name: Publicar en la rama backups (un solo commit con los últimos 12)
        working-directory: ${{ runner.temp }}/branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b backups
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Respaldo cifrado $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" backups
